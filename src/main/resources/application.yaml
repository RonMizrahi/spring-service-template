# Base configuration shared by every profile.
# Environment-specific overrides live in application-{dev,stg,prod}.yaml.
# Select one with SPRING_PROFILES_ACTIVE (defaults to dev for local runs).

spring:
  application:
    name: spring-service-template
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true            # Boot 3.2+ runs Tomcat and @Async on virtual threads from this flag alone.
  jpa:
    open-in-view: false        # don't hold a JPA session open through view rendering
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  address: 0.0.0.0
  port: 8080
  shutdown: graceful

# JWT signing secret. No default here on purpose: stg/prod MUST inject JWT_SECRET
# (docker/helm/env) or the app fails fast at startup. The dev profile supplies a
# local default so a freshly generated service runs with zero setup.
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Feature toggles for optional infrastructure. Off by default so the app boots with
# just a database; each environment turns Redis/Kafka on when they are available.
app:
  cache:
    enabled: ${APP_CACHE_ENABLED:false}
  messaging:
    enabled: ${APP_MESSAGING_ENABLED:false}
    topic: ${APP_KAFKA_TOPIC:template-events}
  init:
    add-admin: ${APP_INIT_ADD_ADMIN:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    enable:
      jvm: true
      system: true
      process: true
      jdbc: true
      hikaricp: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  show-actuator: false

resilience4j:
  circuitbreaker:
    instances:
      externalApi:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      failingService:
        failure-rate-threshold: 100
        sliding-window-size: 5
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2

info:
  app:
    name: Spring Service Template
    description: A Spring Boot 3.5 template with JWT authentication and virtual threads
    version: "@project.version@"
    java:
      version: "@java.version@"
  environment:
    profile: "${spring.profiles.active:default}"
    virtual-threads: "${spring.threads.virtual.enabled}"

# No custom console pattern: Boot's default already appends the correlation id
# (application name, traceId, spanId) once Micrometer tracing is on the classpath.
