# Auto-applied by `docker compose up`. Adds a remote-debug port for local development.
# Attach a debugger to localhost:5005. Remove this file for a production-like run.
services:
  app:
    environment:
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "127.0.0.1:5005:5005"
