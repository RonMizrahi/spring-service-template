services:
  # Spring Boot application (runs the "stg" profile: PostgreSQL + Redis + Kafka).
  app:
    build: .
    image: spring-template:latest
    container_name: spring-template-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-stg}
      JWT_SECRET: ${JWT_SECRET:-local-docker-only-secret-change-me-min-32-characters}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-springdb}
      POSTGRES_USER: ${POSTGRES_USER:-spring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spring123}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_CACHE_ENABLED: "true"
      APP_MESSAGING_ENABLED: "true"
      APP_INIT_ADD_ADMIN: "true"   # seeds admin/admin locally; do NOT set in real stg/prod
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - spring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:16-alpine
    container_name: spring-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-springdb}
      POSTGRES_USER: ${POSTGRES_USER:-spring}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spring123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-sql-schema.sql:/docker-entrypoint-initdb.d/init-sql-schema.sql:ro
    networks:
      - spring-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spring} -d ${POSTGRES_DB:-springdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: spring-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka in KRaft mode with the standard dual-listener setup:
  # INTERNAL (kafka:29092) for in-network clients, EXTERNAL (localhost:9092) for the host.
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: spring-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 01234567-89ab-cdef-0123-456789abcdef
    networks:
      - spring-network
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  zipkin:
    image: openzipkin/zipkin:3
    container_name: spring-zipkin
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
    networks:
      - spring-network

  # Optional management GUIs: `docker compose --profile gui up`
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: spring-redis-gui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    profiles: [gui]
    networks:
      - spring-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: spring-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - kafka
    profiles: [gui]
    networks:
      - spring-network

  adminer:
    image: adminer:4
    container_name: spring-adminer
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - postgres
    profiles: [gui]
    networks:
      - spring-network

volumes:
  postgres_data:
  redis_data:

networks:
  spring-network:
    driver: bridge
